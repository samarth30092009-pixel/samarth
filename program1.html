<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Friends</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            color: white;
            height: 100vh;
            overflow: hidden;

            /* Cool animated gradient background */
            background: linear-gradient(270deg, #ff6b6b, #5f27cd, #00d2d3, #10ac84);
            background-size: 800% 800%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            margin-top: 50px;
            font-size: 40px;
            text-shadow: 2px 2px 10px black;
        }

        .friend {
            background: rgba(0, 0, 0, 0.5);
            width: 300px;
            margin: 15px auto;
            padding: 15px;
            border-radius: 15px;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
        }

        .friend:hover {
            transform: scale(1.1);
            background: rgba(0, 0, 0, 0.7);
        }

        /* Message animation */
        #message {
            margin-top: 20px;
            font-size: 28px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.6s ease;
        }

        #message.show {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <h1>My Friends</h1>

    <div class="friend" onclick="showVansh()">Vansh</div>
    <div class="friend" onclick="showAnubhav()">Anubhav</div>

    <div id="message"></div>

    <script>
        function showVansh() {
            let msg = document.getElementById("message");
            msg.innerHTML = "🏀 Future Indian Basketball Player 🏀";
            msg.classList.add("show");

            setTimeout(() => {
                msg.classList.remove("show");
            }, 3000);
        }

        function showAnubhav() {
            let msg = document.getElementById("message");
            msg.innerHTML = "🎓 Future IITian 🎓";
            msg.classList.add("show");

            setTimeout(() => {
                msg.classList.remove("show");
            }, 3000);
        }
    </script>

</body>
</html>
